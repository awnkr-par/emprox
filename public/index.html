<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EmProx — Web Viewer</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell">
  <header><div class="brand"><div class="logo">e<span>m</span></div><div><strong>EmProx</strong><small>Lightweight web viewer · v0.1</small></div></div><span class="status"><i></i> Ready</span></header>
  <section class="toolbar"><form id="navigate"><label for="url" class="sr-only">Website URL</label>
   <button type="button" id="home" title="Home">⌂</button>
   <input id="url" type="url" placeholder="https://example.org" value="https://example.org" required autocomplete="url" spellcheck="false">
   <button type="submit" class="go">Go <span>↗</span></button>
  </form></section>
  <section id="welcome" class="welcome"><div class="orb">◈</div><p class="eyebrow">THE LIGHTER WAY TO BROWSE</p>
  <h1>Welcome to <em>EmProx.</em></h1><p>Enter an allowed website URL above to view its pages through your own server.</p>
  <div class="info" id="hosts">Loading permitted websites…</div></section>
  <section id="viewport" class="viewport hidden"><div class="viewer-head"><span id="current">Page preview</span><button type="button" id="close">✕ Close</button></div>
   <iframe id="page" title="Proxied page" referrerpolicy="no-referrer" sandbox="allow-same-origin"></iframe></section>
  <footer><span>EmProx is a restricted, server-side HTML viewer.</span><span>Built for Render · No tracking</span></footer>
</main><script src="/app.js"></script></body></html>
